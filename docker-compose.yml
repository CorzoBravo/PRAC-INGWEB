services:
  # ==========================================
  # 1. Base de Datos Central (PostgreSQL 15)
  # ==========================================
  postgres:
    image: postgres:15
    container_name: clinica-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinica_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinica_password}
      POSTGRES_DB: ${POSTGRES_DB:-clinica_db}
    # Puerto 5432 expuesto al host para administración con DBeaver/pgAdmin
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # ==========================================
  # 2. Microservicio de Usuarios y Autenticación
  # ==========================================
  user-service:
    build:
      context: ./clinica-microservices/user-service
    container_name: clinica-user-service
    environment:
      - PORT=3001
      - DATABASE_URL=postgresql://${POSTGRES_USER:-clinica_user}:${POSTGRES_PASSWORD:-clinica_password}@postgres:5432/${POSTGRES_DB:-clinica_db}?schema=public
      - JWT_SECRET=${JWT_SECRET:-clinica_jwt_secret_key_change_in_production_2026_super_secure}
      - NODE_ENV=${NODE_ENV:-production}
    # Puerto interno: Solo accesible dentro de la red interna de Docker a través del API Gateway
    depends_on:
      - postgres
    restart: unless-stopped

  # ==========================================
  # 3. Microservicio de Citas Médicas
  # ==========================================
  appointment-service:
    build:
      context: ./clinica-microservices/appointment-service
    container_name: clinica-appointment-service
    environment:
      - PORT=8000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-clinica_user}:${POSTGRES_PASSWORD:-clinica_password}@postgres:5432/${POSTGRES_DB:-clinica_db}?schema=appointments
      - JWT_SECRET=${JWT_SECRET:-clinica_jwt_secret_key_change_in_production_2026_super_secure}
      - NODE_ENV=${NODE_ENV:-production}
    # Puerto interno: Solo accesible a través del API Gateway
    depends_on:
      - postgres
    restart: unless-stopped

  # ==========================================
  # 4. API Gateway (Borde de Entrada / Proxy Inverso)
  # ==========================================
  api-gateway:
    build:
      context: ./clinica-microservices/api-gateway
    container_name: clinica-api-gateway
    environment:
      - PORT=3000
      - USER_SERVICE_URL=http://user-service:3001
      - APPOINTMENT_SERVICE_URL=http://appointment-service:8000
      - NODE_ENV=${NODE_ENV:-production}
    ports:
      - "3000:3000"
    depends_on:
      - user-service
      - appointment-service
    restart: unless-stopped

  # ==========================================
  # 5. Frontend (React + Vite + Nginx)
  # ==========================================
  frontend:
    build:
      context: ./FrontEndd-app-INGWEB
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:3000/api}
    container_name: clinica-frontend
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    restart: unless-stopped

volumes:
  postgres_data:
